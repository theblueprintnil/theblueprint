[project]
name = "blueprint-agent-engine"
version = "0.1.0"
description = "LangGraph + Celery agent engine for The Blueprint NIL content generation and compliance."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.10",
    "celery[redis]>=5.4.0",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.2.1",
    "psycopg-pool>=3.2.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
]

[tool.vercel]
entrypoint = "agent_engine.api:app"

[[tool.vercel.subscribers]]
entrypoint = "worker:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
